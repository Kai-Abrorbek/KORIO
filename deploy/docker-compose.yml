# KORIO API — blue/green 무중단 배포.
#
#   두 색을 항상 정의해 두고, 배포 스크립트가 번갈아 띄우고 내린다.
#   Caddy 는 /ready 헬스체크로 살아 있는 쪽만 고르므로 설정을 다시 읽지 않는다.
#
#   운영 명령은 전부 ./deploy.sh 를 쓴다. compose 를 직접 up 하면
#   두 색이 동시에 뜨거나 둘 다 내려가서 무중단이 깨진다.
#
# MongoDB 는 Atlas(외부)를 쓴다 — 여기 DB 컨테이너는 없다.
# API 는 상태를 디스크에 안 쓴다(TTS 캐시는 메모리). 그래서 볼륨도 없다.

name: korio

services:
  caddy:
    image: caddy:2-alpine
    container_name: korio_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN 을 .env 에 넣어라}
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN 을 .env 에 넣어라}
      TELEGRAM_DOMAIN: ${TELEGRAM_DOMAIN:?TELEGRAM_DOMAIN 을 .env 에 넣어라}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN 을 .env 에 넣어라}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL 을 .env 에 넣어라}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 초대 링크 랜딩 + 앱링크 검증 파일 (assetlinks.json)
      - ./www:/srv/www:ro
      - caddy_data:/data # 발급받은 인증서. 지우면 Let's Encrypt 한도에 걸린다
      - caddy_config:/config
    networks: [korio_net]

  api_blue:
    image: ${IMAGE:-korio-api}:${TAG:-latest}
    container_name: korio_api_blue
    restart: unless-stopped
    env_file:
      - ./api.env
    environment:
      PORT: "3000"
      NODE_ENV: production
      INSTANCE_COLOR: blue
    healthcheck:
      # DB 까지 붙었는지 본다. 컨테이너 안에서 도니 curl 없이 node 로 찌른다
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 40s
    # SIGTERM 후 드레인(기본 8초) 이 끝날 때까지 기다려 준다.
    # 이 값이 SHUTDOWN_DRAIN_MS 보다 짧으면 도커가 처리 중인 요청을 죽인다
    stop_grace_period: 30s
    networks: [korio_net]

  api_green:
    image: ${IMAGE:-korio-api}:${TAG:-latest}
    container_name: korio_api_green
    restart: unless-stopped
    env_file:
      - ./api.env
    environment:
      PORT: "3000"
      NODE_ENV: production
      INSTANCE_COLOR: green
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    networks: [korio_net]

  telegram_blue:
    image: ${TELEGRAM_IMAGE:-korio-telegram}:${TAG:-latest}
    container_name: korio_telegram_blue
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [korio_net]

  telegram_green:
    image: ${TELEGRAM_IMAGE:-korio-telegram}:${TAG:-latest}
    container_name: korio_telegram_green
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [korio_net]

  # 운영 콘솔. telegram 과 같은 구조(정적 export + nginx)다.
  # 화면과 API 를 같은 오리진으로 내보내서 CORS 를 안 탄다.
  admin_blue:
    image: ${ADMIN_IMAGE:-korio-admin}:${TAG:-latest}
    container_name: korio_admin_blue
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [korio_net]

  admin_green:
    image: ${ADMIN_IMAGE:-korio-admin}:${TAG:-latest}
    container_name: korio_admin_green
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [korio_net]

  # ── AI 튜터 음성 Agent ──────────────────────────────────────────
  #
  #   앱 ──WebRTC──▶ LiveKit ──▶ [이것] ──Gemini Live──▶ gemini-3.8-live
  #
  # ⚠️ **일부러 blue/green 이 아니다.** 인바운드 트래픽이 없어서 무중단의
  #    대상이 아니고, 무엇보다 두 색이 동시에 뜨면 **둘 다 같은 agentName 으로
  #    LiveKit 에 등록돼서 dispatch 가 둘 중 아무 데나 간다.** 그러면 배포
  #    직후 절반의 통화가 옛 프롬프트로 돈다.
  #
  # 배포는 "새 이미지로 갈아끼우고 다시 띄운다" 다. 그 몇 초 동안 새로
  # 시작하는 통화는 실패한다 (기존 통화는 stop_grace_period 동안 살아 있다).
  # 통화가 뜸한 시간에 배포해라.
  tutor_agent:
    image: ${AGENT_IMAGE:-korio-tutor-agent}:${TAG:-latest}
    container_name: korio_tutor_agent
    restart: unless-stopped
    env_file:
      # 🔴 GOOGLE_API_KEY 가 여기 있다. api.env 와 **분리**한다 —
      #    Gemini 에 붙는 건 Agent 뿐이라 API 컨테이너가 알 이유가 없다.
      - ./agent.env
    environment:
      NODE_ENV: production
    healthcheck:
      # ⚠️ 프로세스가 살아 있는지가 아니라 **LiveKit 에 등록됐는지**를 본다.
      #    GET / 는 worker 의 WebSocket 이 OPEN 일 때만 200 이다. 이게 아니면
      #    "컨테이너는 떠 있는데 아무도 방에 안 들어오는" 상태를 못 잡는다.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      # 모델(@livekit/local-inference, 34MB)을 자식 프로세스에 올리고
      # LiveKit 에 붙을 때까지 시간이 걸린다. 짧게 잡으면 부팅 중에 죽인다
      start_period: 60s
      retries: 3
    # 통화 중인 세션이 드레인될 시간. 배포할 때 말하던 선생님이 뚝 끊기지 않게
    stop_grace_period: 30s
    networks: [korio_net]

networks:
  korio_net:
    name: korio_net

volumes:
  caddy_data:
  caddy_config:
