  footer{max-width:760px;margin:0 auto;padding:0 20px 50px;font-size:12.5px;color:#9A97AD}

en: {

  updated: "Effective: 7 September 2026",
  s: [
    ["Overview",
     "<p>KORIO (the \"service\") is a mobile app for learning Korean. This policy explains what we receive, why we use it, how long we keep it, and what you can ask us to do.</p><p>Operator: " + OP.dev + " · Contact: <a href='mailto:" + OP.email + "'>" + OP.email + "</a></p>"],

    ["Why we use it",
     "<ul><li>Creating your account, signing you in, verifying it is you</li><li>Saving progress and building personalised review</li><li>Social features: leagues, friends, invites</li><li>Checking subscription status and unlocking premium features</li><li>Study reminders and announcements (you can turn these off)</li><li>Finding bugs and improving the service</li></ul><p>We do not sell your personal data to third parties for advertising.</p>"],
    ["Third parties",
     "<p>These providers process data on our behalf, limited to what running the service requires.</p>",
     [["Provider","What","Why"],
      ["Google Play (Google LLC)","Purchase token, subscription status","Billing and subscription verification"],
